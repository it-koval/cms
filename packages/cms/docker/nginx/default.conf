# Security headers: when the application already set one (the admin sends its own Referrer-Policy), its value is kept,
# otherwise the default is used. This way a response never carries the same header twice with different values.
resolver 127.0.0.11 valid=10s ipv6=off;

map $upstream_http_x_content_type_options $itk_nosniff {
    default $upstream_http_x_content_type_options;
    "" "nosniff";
}
map $upstream_http_referrer_policy $itk_referrer_policy {
    default $upstream_http_referrer_policy;
    "" "strict-origin-when-cross-origin";
}
map $upstream_http_x_frame_options $itk_frame_options {
    default $upstream_http_x_frame_options;
    "" "SAMEORIGIN";
}

server {
    listen 80;
    server_name _;
    root /app/public;

    client_max_body_size 256m;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_read_timeout 300;
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header X-Frame-Options;

    # Compression of text responses (html is always compressed when gzip is on); images and fonts are already compressed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/xml;

    # Security headers. SAMEORIGIN: the admin preview opens in an iframe of the same site.
    # A location block with its own add_header does not inherit these lines, so they are repeated there.
    add_header X-Content-Type-Options $itk_nosniff always;
    add_header Referrer-Policy $itk_referrer_policy always;
    add_header X-Frame-Options $itk_frame_options always;

    location = /_nginx_health {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Stay in this location while reading the body so the limit also applies to chunked forms.
    location ^~ /request/ {
        client_max_body_size 256k;
        fastcgi_request_buffering on;
        rewrite ^ /index.php break;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PHP_VALUE "post_max_size=256K";
    }

    # Resized WebP variants of uploads (bundle route itk_image_variant): the first request is made by PHP and saved here,
    # the next ones are static files. Names are final (a new upload gets a new name), so the cache may be long.
    location ^~ /uploads/media/_v/ {
        try_files $uri /index.php$is_args$args;
        access_log off;
        expires 1y;
    }

    # Build files with a hash in the name (main-0d650809.css): the name changes with the content, so they are cached for a year without revalidation.
    # A missing file falls through to index.php (a 404 page), like the rest of the static files.
    location ~* "^/build/.+-[0-9a-f]{8}\.(?:css|js|woff2?|ttf|eot|svg|webp|avif|png|jpe?g|gif|mp4|webm)$" {
        try_files $uri /index.php$is_args$args;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Static files that do not exist fall back to index.php (404 page of the site).
    location ~* \.(?:ico|css|js|map|gif|webp|avif|jpe?g|png|svg|woff2?|eot|ttf|mp4|webm)$ {
        try_files $uri /index.php$is_args$args;
        access_log off;
        expires 7d;
    }

    location ~ ^/index\.php(/|$) {
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
