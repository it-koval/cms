# Copy this file to the site root. Use it on its own: docker compose -f compose.prod.yaml.
name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

x-runtime: &runtime
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-build: &build
  context: .
  dockerfile: docker/Dockerfile
  args:
    PHP_VERSION: ${PHP_VERSION:-8.4}
    CRITICAL_CSS: ${CRITICAL_CSS:-0}
    UID: "10033"
    GID: "10033"

x-app: &app
  <<: *runtime
  security_opt: ["no-new-privileges:true", "seccomp=./docker/chrome-seccomp.json"]
  image: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}-app:${DEPLOY_IMAGE_TAG:?set DEPLOY_IMAGE_TAG}
  environment:
    APP_ENV: prod
    APP_DEBUG: "0"
    SKIP_ENTRYPOINT: "1"
    APP_SECRET:
    DATABASE_URL:
    DEFAULT_URI:
    MAILER_DSN:
    SYMFONY_DECRYPTION_SECRET:
  volumes:
    - uploads:/app/public/uploads
  depends_on:
    database:
      condition: service_healthy

services:
  php:
    <<: *app
    build:
      <<: *build
      target: php_prod

  nginx:
    <<: *runtime
    image: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}-nginx:${DEPLOY_IMAGE_TAG:?set DEPLOY_IMAGE_TAG}
    build:
      <<: *build
      target: nginx_prod
    ports:
      - "127.0.0.1:${DEPLOY_PORT:?set DEPLOY_PORT}:80"
    volumes:
      - uploads:/app/public/uploads:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_nginx_health"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "async", "critical_css", "knowledge_base", "--time-limit=3600", "--memory-limit=256M"]
    init: true
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "grep -zq '[m]essenger:consume' /proc/[0-9]*/cmdline"]
      interval: 5s
      timeout: 3s
      retries: 12

  database:
    <<: *runtime
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${DEPLOY_DB_NAME:-app}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

secrets:
  postgres_password:
    environment: DEPLOY_DB_PASSWORD

volumes:
  postgres_data:
  uploads:
