name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', symfony: '7.4.*' }
          - { php: '8.4', symfony: '7.4.*' }
          - { php: '8.4', symfony: '8.1.*' }

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: itk-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pitk-test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="/mailpit readyz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:itk-test@127.0.0.1:3306/itk?serverVersion=8.4&charset=utf8mb4
      ITK_TEST_MAILPIT_URL: http://127.0.0.1:8025
      ITK_TEST_MAILPIT_SMTP_PORT: '1025'

    defaults:
      run:
        working-directory: packages/cms

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, exif, gd, json, mbstring, pdo_mysql, sodium
          coverage: none
          tools: composer:v2

      # symfony/flex only to pin the Symfony line through SYMFONY_REQUIRE; the bundle itself does not use it
      - name: Install symfony/flex globally
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      # composer.lock of the bundle is not committed (a library), so this resolves the newest versions inside the pinned Symfony line
      - name: composer install
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: composer install --no-progress --prefer-dist

      - run: composer validate --strict

      - name: composer test (database, migrations, itk:install, PHPUnit)
        run: composer test

      - name: Doctrine schema is in sync with the mapping
        run: php tests/bin/console doctrine:schema:validate --env=test

      - name: PHPStan
        run: composer stan

      - name: PHP CS Fixer (dry run)
        run: composer cs

  admin:
    name: Admin (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: admin/.nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      - run: npm run lint

      # the catalogues of the interface (admin/src/i18n, packages/cms/translations): the same keys and {params} in en, ru, kk, every key used and present, no Cyrillic in the code
      - run: npm run check:i18n

      - run: npm test

      - run: npm run build

      # the built admin is committed: it must be what the sources build to. -N makes files that the build added show up in the diff
      - name: The built admin matches the sources
        working-directory: .
        run: |
          git add --intent-to-add packages/cms/public/admin
          git diff --exit-code packages/cms/public/admin

  docker:
    name: Docker kit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # the context is packages/cms: the COPY paths of docker/Dockerfile start with docker/, the same as in a site root
      - name: Build php_dev with Node and Chromium
        uses: docker/build-push-action@v6
        with:
          context: packages/cms
          file: packages/cms/docker/Dockerfile
          target: php_dev
          build-args: |
            CRITICAL_CSS=1
          load: true
          tags: itk-docker:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test inside the image
        run: docker run --rm -v "$PWD:/repo:ro" itk-docker:dev bash /repo/packages/cms/tests/docker/smoke.sh

      - name: Build php_dev without Node (the default for sites)
        uses: docker/build-push-action@v6
        with:
          context: packages/cms
          file: packages/cms/docker/Dockerfile
          target: php_dev
          load: true
          tags: itk-docker:plain
          cache-from: type=gha

      - name: The default image has no Node, php-fpm and nginx configs are valid
        run: |
          docker run --rm itk-docker:plain sh -c '! command -v node'
          docker run --rm -e SKIP_ENTRYPOINT=1 itk-docker:dev php-fpm -t
          docker run --rm --add-host php:127.0.0.1 -v "$PWD/packages/cms/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
