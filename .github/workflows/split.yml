name: Split package

# Packagist reads composer.json from the root of it-koval/cms-bundle.
# CI calls this job only after all checks pass in the same run and for the same SHA.
on:
  workflow_call:
    secrets:
      CMS_BUNDLE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: split
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Use CMS_BUNDLE_TOKEN for the other repository, never the checkout credential.
          persist-credentials: false

      - name: Push packages/cms to it-koval/cms-bundle
        env:
          TOKEN: ${{ secrets.CMS_BUNDLE_TOKEN }}
        run: |
          split=$(git subtree split --prefix=packages/cms HEAD)
          remote="https://x-access-token:${TOKEN}@github.com/it-koval/cms-bundle.git"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git push "$remote" "${split}:refs/tags/${GITHUB_REF_NAME}"
          else
            git push "$remote" "${split}:refs/heads/main"
          fi
