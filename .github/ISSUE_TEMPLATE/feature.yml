name: Feature request / Предложение
description: Suggest an improvement. Предложите улучшение.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve? / Какую задачу вы решаете?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed change / Предлагаемое изменение
    validations:
      required: true
